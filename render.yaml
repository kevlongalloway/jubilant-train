# Précis — Render Blueprint
# Deploys: PostgreSQL database + Node.js web service (API + static frontend)
#
# Architecture:
#   - One web service runs Express which serves BOTH the REST API (/api/*)
#     AND the built React frontend (static files from /dist).
#   - This avoids CORS issues and keeps the setup simple on Render's free tier.
#
# Deploy flow:
#   1. npm run build       → builds React frontend into /dist
#   2. cd server && npm install && npx prisma generate && npx prisma migrate deploy
#                          → installs backend deps, generates Prisma client, runs migrations
#   3. node server/index.js → starts Express (serves API + static frontend)

databases:
  - name: precis-db
    databaseName: precis
    user: precis_user
    plan: free
    region: oregon

services:
  - type: web
    name: precis-app
    env: node
    plan: free
    region: oregon

    # Build: compile React frontend, then set up backend
    buildCommand: >
      npm install &&
      npm run build &&
      cd server &&
      npm install &&
      npx prisma generate &&
      npx prisma migrate deploy

    # Start Express server (serves both API and static frontend)
    startCommand: node server/index.js

    # Health check so Render knows the service is up
    healthCheckPath: /api/health

    envVars:
      # Auto-injected by Render from the database above
      - key: DATABASE_URL
        fromDatabase:
          name: precis-db
          property: connectionString

      - key: NODE_ENV
        value: production

      # Render auto-generates a secure random value for secrets
      - key: JWT_SECRET
        generateValue: true

      # Render sets PORT automatically — Express reads process.env.PORT
      # (No need to set PORT here; Render injects it)
